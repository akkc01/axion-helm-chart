namespace: akkc


database:
  postgresUser: jarvis
  postgresPassword: jarvis123
  postgresDb: jarvis

pgadmin:
  email: jarvis@gmail.com
  password: jarvis123

  deployment:
    name: pgadmin-deploy

  replicas: 1

  labels:
    app: pgadmin

  container:
    name: pgadmin

  image: dpage/pgadmin4:9.17

  containerPort: 80

  config:
    enhancedCookieProtection: "False"

  service:
    name: pgadmin-svc
    port: 80
    targetPort: 80
    type: ClusterIP


# -------------------------
# PostgreSQL
# -------------------------
postgres:

  deployment:
    name: postgres-deploy

  replicas: 1

  labels:
    app: postgres

  container:
    name: postgres

  image: postgres:16

  containerPort: 5432

  env:
    pgdata: /var/lib/postgresql/data/pgdata

  volume:
    name: postgres-data
    mountPath: /var/lib/postgresql/data

  service:
    name: postgres-svc
    port: 5432
    targetPort: 5432
    type: ClusterIP




ingress:
  enabled: true

  name: axion-agic-ingress

  ingressClassName: azure-application-gateway

  annotations:
   # kubernetes.io/ingress.class: "azure/application-gateway"
    appgw.ingress.kubernetes.io/health-probe-path: "/misc/ping"
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    appgw.ingress.kubernetes.io/backend-hostname: "pgad.theakkc.space"

  hosts:

    - host: pgadmin.theakkc.space
      paths:
        - path: /
          pathType: Prefix
          service:
            name: pgadmin-svc
            port: 80
