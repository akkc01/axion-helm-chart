namespace: axion-prod

database:
  postgresUser: jarvis
  postgresPassword: jarvis12345
  postgresDb: jarvis-db


service:
  name: postgres-svc
  type: ClusterIP
  port: 5432
  targetPort: 5432
  protocol: TCP
  labels:
    app: postgres
  selector:
    app: postgres

# configMap----
postgresInit:
  # configMapName: postgres-init-sql
  sql:
    001-telemetry.sql: |
      CREATE TABLE telemetry (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),

          device_id VARCHAR(50) NOT NULL,
          device_type VARCHAR(20) NOT NULL,
          refinery_region VARCHAR(50) NOT NULL,

          timestamp TIMESTAMP NOT NULL,

          temperature DOUBLE PRECISION NOT NULL,
          vibration DOUBLE PRECISION NOT NULL,
          current DOUBLE PRECISION NOT NULL,

          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

      CREATE INDEX idx_telemetry_device_id
      ON telemetry(device_id);

      CREATE INDEX idx_telemetry_timestamp
      ON telemetry(timestamp DESC);

