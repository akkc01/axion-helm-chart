# deployment--
postgres:
  enabled: true

  # name: postgres-deployment
  appName: postgres

  replicas: 1

  image:
    repository: postgres
    tag: "17"
    pullPolicy: Always

  service:
    port: 5432
    targetPort: 5432

  secret:
    name: postgres-secret
    databaseKey: POSTGRES_DB
    usernameKey: POSTGRES_USER
    passwordKey: POSTGRES_PASSWORD

  persistence:
    claimName: postgres-pvc
    mountPath: /var/lib/postgresql/data

  initSql:
    configMapName: postgres-init-sql
    mountPath: /docker-entrypoint-initdb.d

  pgdata: /var/lib/postgresql/data/pgdata

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"

    limits:
      cpu: "400m"
      memory: "1Gi"

  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
