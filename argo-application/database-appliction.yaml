apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: axion-db
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/akkc01/axion-helm-chart.git
    targetRevision: main
    path: database

    helm:
      releaseName: dev
      valueFiles:
        - dev.values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: axion-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true