namespace: dev-akkc

replicaCount: 1

labels:
  app: axion-ui

container:
  name: axion-ui-container
  port: 80

image:
  repository: amitkkc01/axion-ui
  tag: "aa57d82"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi


service:
  port: 80
  targetPort: 80
  type: ClusterIP


autoscaling:
  enabled: true

  minReplicas: 1
  maxReplicas: 5

  targetCPUUtilizationPercentage: 70


ingress:
  enabled: true

  ingressClassName: azure-application-gateway

  annotations:
   # kubernetes.io/ingress.class: "azure/application-gateway"
    appgw.ingress.kubernetes.io/health-probe-path: "/misc/ping"
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    appgw.ingress.kubernetes.io/backend-hostname: "pgad.theakkc.space"

  hosts:
    - host: dev.axion.theakkc.space
      paths:
        - path: /
          pathType: Prefix
          service:
            name: axion-ui-svc
            port: 80

    - host: axion.argocd.theakkc.space
      paths:
        - path: /
          pathType: Prefix
          service:
            name: argocd-server
            port: 80


        