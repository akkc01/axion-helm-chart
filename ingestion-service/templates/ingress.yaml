{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "ingestion.ingName" . }}
  namespace: {{ .Values.namespace }}

  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}

  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}

            backend:
              service:
                name: {{ include "ingestion.serviceName" $ }}
                port:
                  number: {{ .service.port }}
          {{- end }}
    {{- end }}

{{- end }}