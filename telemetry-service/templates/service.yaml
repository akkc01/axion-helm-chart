apiVersion: v1
kind: Service

metadata:
  name: {{ include "telemetry.serviceName" . }}
  namespace: {{ .Values.namespace }}

spec:
  selector:
    {{- toYaml .Values.service.selector | nindent 4 }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

  type: {{ .Values.service.type }}